name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The secrets stage scans the whole git history, so the clone must not be shallow.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ShellCheck and gitleaks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Shell scripts (ShellCheck)
        run: make shellcheck

      - name: Secrets (gitleaks, whole history)
        run: gitleaks git --no-banner --redact .

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --enable=funlen --enable=gocyclo

      - name: Go unit tests
        run: make test

      - name: Set up Node for UI checks
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: UI contract, unit tests and coverage
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run lint
          npm run typecheck
          npm test
          npm run test:coverage
          npm audit

      - name: Python unit tests
        run: make python-tests

      - name: Installer and staging script tests
        run: make test-install test-docker-staging

      - name: UI browser smoke (demo and contract API)
        run: npm run test:ui

      - name: Every API operation has a test
        run: |
          make test-matrix
          node scripts/e2e-scenarios.mjs

      - name: Observability tooling (dashboard and alert definitions, Vector config)
        run: |
          python3 -m unittest discover -s tests/observability
          docker run --rm -e OPENOBSERVE_URL=http://127.0.0.1:5080 -e OPENOBSERVE_USER=u -e OPENOBSERVE_PASSWORD=p \
            -v "$PWD/deploy/observability/vector.yaml":/etc/vector/vector.yaml:ro timberio/vector:0.43.1-alpine test /etc/vector/vector.yaml
