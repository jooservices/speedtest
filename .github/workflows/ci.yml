name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Fetch verified MaxMind test fixtures
        run: python3 scripts/geo-test-fixtures.py

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Set up Node for UI checks
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: UI contract, unit tests and coverage
        run: |
          npm ci
          npm run lint
          npm run test:coverage
          npm audit

      - name: UI browser smoke (demo and contract API)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Every API operation has a test
        run: |
          node scripts/test-matrix.mjs
          node scripts/e2e-scenarios.mjs
