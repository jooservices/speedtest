# Go build and unit tests. On a pull request it runs only when Go code, modules or migrations change; a push to develop or master always runs it.
name: Go tests

on:
  push:
    branches: [develop, master]
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - migrations/**
      - Makefile
      - scripts/geo-test-fixtures.py
      - .github/workflows/go-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Go unit tests
        run: make test
