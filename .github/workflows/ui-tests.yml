# UI unit tests with coverage and the browser smoke, in two jobs that run side by side. On a pull request it runs only when UI files, UI tests or the npm setup change; a push to develop or master always runs it.
name: UI tests

on:
  push:
    branches: [develop, master]
  pull_request:
    paths:
      - ui/**
      - tests/ui/**
      - tests/ui-fixtures/**
      - tests/e2e/**
      - package.json
      - package-lock.json
      - jsconfig.json
      - .github/workflows/ui-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ui-unit:
    name: UI unit tests, coverage and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UI unit tests
        run: npm test

      - name: UI coverage
        run: npm run test:coverage

      - name: Dependency audit
        run: npm audit

  ui-smoke:
    name: UI browser smoke (demo and contract API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI browser smoke
        run: npm run test:ui
