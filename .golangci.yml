version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocritic
    - funlen
    - gocyclo
  settings:
    funlen:
      lines: 286
      statements: 193
    gocyclo:
      min-complexity: 30
  exclusions:
    rules:
      # Integration test flows are long by nature; only gocyclo is relaxed for them.
      - linters:
          - gocyclo
        path: (^|[/_])integration_test\.go$

formatters:
  enable:
    - gofmt
    - goimports
