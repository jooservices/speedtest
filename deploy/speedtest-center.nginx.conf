# Example reverse proxy for the Speedtest command center (nginx).
#
# This is a template, not a working configuration: substitute your hostname,
# certificate paths, the monitoring address and, if SPEEDTEST_HTTP_ADDR is
# changed, the upstream address. The center speaks plain HTTP on
# SPEEDTEST_HTTP_ADDR (default 127.0.0.1:8080) and must stay behind TLS; never
# expose it directly. Node credentials and UI sessions travel over this proxy,
# and the center trusts it for the client address, so only this proxy may reach
# the upstream port. Not validated with `nginx -t` in the development
# environment (nginx is not installed there); run `nginx -t` before use.

upstream speedtest_center {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name speedtest.example.com;

    ssl_certificate     /etc/ssl/certs/speedtest.example.com.crt;
    ssl_certificate_key /etc/ssl/private/speedtest.example.com.key;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:speedtest_tls:10m;
    ssl_session_tickets off;

    # Browser hardening. The center itself sends the Content-Security-Policy and the other security
    # headers on every response (internal/center/server/headers.go); a second policy here would be
    # enforced as well and could only make it stricter, so it is deliberately not repeated.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Result batches and API bodies are small; refuse large uploads early.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;      # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Installer progress is a server-sent event stream: no buffering, long read.
    location ~ ^/api/installations/[^/]+/events$ {
        proxy_pass http://speedtest_center;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering "no" always;
    }

    # Health endpoints only from the monitoring source.
    location ~ ^/(healthz|readyz)$ {
        allow 192.0.2.10;       # replace with your monitoring address
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://speedtest_center;
    }

    location / {
        proxy_pass http://speedtest_center;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name speedtest.example.com;
    return 301 https://$host$request_uri;
}
