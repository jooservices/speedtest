        - jitter
        - dLat
        - uLat
        - loss
        - serverId
        - ip
        - threads
        - bytesDown
        - bytesUp
        - duration
        - error
        - manual
      description: Globally unique UUID allocated before spooling. Failed results require a nonempty error and allow null
        metrics/serverId/ip; ok/degraded require down, up, ping, ip and server identity, and error=null. down/up
        are Mbps; ping/jitter/dLat/uLat are ms. Missing measurements remain null. Engine-specific
        loss/jitter/loaded metrics may be null even on success when unavailable; never invent zero.
