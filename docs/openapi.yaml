components:
  securitySchemes:
    OwnerBearer:
      type: http
      scheme: bearer
      bearerFormat: API token
    SessionCookie:
      type: apiKey
      in: cookie
      name: speedtest_session
      description: Opaque server-side session; UI writes also require X-CSRF-Token and same-origin Origin validation.
    NodeBearer:
      type: http
      scheme: bearer
      description: Node-scoped long-lived credential; never accepts UI sessions or enrollment keys.
    EnrollmentKey:
      type: http
      scheme: bearer
      description: Shared Settings key, accepted only to create enrollment tokens.
  parameters:
    Engine:
      name: engine
      in: query
      description: Omission uses each node's primary engine; engines are never blended.
      schema:
        $ref: "#/components/schemas/Engine"
    ISP:
      name: isp
      in: query
      required: false
      description: Optional trimmed, case-insensitive exact ISP match (1–200 characters). Effective ISP uses the result engine ISP, then cached IP organisation; records with unknown ISP are excluded when filtering.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Page:
      name: page
      in: query
      required: false
      description: 1-based page.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Maximum items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Nodes:
      name: nodes
      in: query
      required: false
      description: Comma-separated node IDs; omitted means all authorized nodes, empty means none.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ID"
        maxItems: 100
        uniqueItems: true
      style: form
      explode: false
    ISPs:
      name: isps
      in: query
      required: false
      description: Comma-separated ISP IDs; omitted means all, empty means none.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ID"
        maxItems: 100
        uniqueItems: true
      style: form
      explode: false
    ISPId:
      name: isp
      in: query
      required: false
      description: Optional ISP entity ID filter for alert events.
      schema:
        $ref: "#/components/schemas/ID"
    Node:
      name: node
      in: query
      required: false
      description: Optional single-node filter; omitted means all.
      schema:
        $ref: "#/components/schemas/ID"
    From:
      name: from
      in: query
      required: false
      description: Inclusive start; paired with to. Overrides the default range; explicitly supplying both
        range and from/to is invalid.
      schema:
        $ref: "#/components/schemas/Timestamp"
    To:
      name: to
      in: query
      required: false
      description: Exclusive end; must follow from; maximum analytics span 366 days.
      schema:
        $ref: "#/components/schemas/Timestamp"
    Range:
      name: range
      in: query
      required: false
      description: Trailing range ending at snapshot, default 7d only if no from/to. Explicit range with
        from/to is invalid.
      schema:
        $ref: "#/components/schemas/Range"
    Metric:
      name: metric
      in: query
      required: false
      description: Selected metric; default down.
      schema:
        $ref: "#/components/schemas/Metric"
        default: down
    Timezone:
      name: timezone
      in: query
      required: false
      description: IANA zone for calendar grouping, never browser.
      schema:
        type: string
        description: IANA time-zone name; browser is a UI preference only and must be resolved before
          analytics requests.
        examples:
          - Asia/Ho_Chi_Minh
        default: UTC
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Required strong ETag from GET; 412 if stale, 428 if missing.
      schema:
        type: string
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token from auth/me, including the anonymous bootstrap session.
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      description: Must be the same origin as the command center request. HTTPS deployments behind a TLS-terminating proxy must configure its CIDR as trusted.
      schema:
        type: string
        format: uri
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for retryable creates. Same principal/key/body replays original response for
        24h; different body returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Status:
      name: status
      in: query
      required: false
      description: Result status filter.
      schema:
        type: string
        enum:
          - all
          - ok
          - degraded
          - failed
        default: all
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive substring in IP, server name/city, location city/ISP, node name/label
        or error.
      schema:
        type: string
        maxLength: 200
    MinDown:
      name: minDown
      in: query
      required: false
      description: Inclusive minimum download; null metrics do not match.
      schema:
        $ref: "#/components/schemas/Mbps"
    MaxDown:
      name: maxDown
      in: query
      required: false
      description: Inclusive maximum download; must be >= minDown.
      schema:
        $ref: "#/components/schemas/Mbps"
    Sort:
      name: sort
      in: query
      required: false
      description: Allowlisted sort key; node=name, server=city; nulls last; id breaks ties.
      schema:
        type: string
        enum:
          - ts
          - node
          - down
          - up
          - ping
          - jitter
          - loss
          - server
          - ip
          - status
        default: ts
    Dir:
      name: dir
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
  headers:
    Allow:
      description: Methods supported by the requested resource.
      required: true
      schema:
        type: string
    ETag:
      description: Strong version of this representation.
      schema:
        type: string
    Location:
      description: URI of the created or accepted resource.
      schema:
        type: string
        format: uri-reference
    SetCookie:
      description: "speedtest_session cookie: HttpOnly; SameSite=Lax; Path=/; Secure over HTTPS. Logout
        expires it."
      schema:
        type: string
    RetryAfter:
      description: Seconds before retry.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/badrequest
            title: Malformed request
            status: 400
            detail: Malformed request.
    Unauthorized:
      description: Missing, expired, revoked or invalid credential
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/unauthorized
            title: Missing, expired, revoked or invalid credential
            status: 401
            detail: Missing, expired, revoked or invalid credential.
      headers:
        WWW-Authenticate:
          description: Bearer for agent/bootstrap; Session for UI.
          schema:
            type: string
    Forbidden:
      description: Not authorized or CSRF/Origin validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/forbidden
            title: Not authorized or CSRF/Origin validation failed
            status: 403
            detail: Not authorized or CSRF/Origin validation failed.
    NotFound:
      description: Resource not found or not owned
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/notfound
            title: Resource not found or not owned
            status: 404
            detail: Resource not found or not owned.
    MethodNotAllowed:
      description: The request method is not supported by this resource
      headers:
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/methodnotallowed
            title: Method not allowed
            status: 405
            detail: The request method is not allowed for this resource.
    Conflict:
      description: State, unique name or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/conflict
            title: State, unique name or idempotency conflict
            status: 409
            detail: State, unique name or idempotency conflict.
    Stale:
      description: ETag does not match
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/stale
            title: ETag does not match
            status: 412
            detail: ETag does not match.
    TooLarge:
      description: Request body exceeds limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/toolarge
            title: Request body exceeds limit
            status: 413
            detail: Request body exceeds limit.
    Validation:
      description: Field or cross-field validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/validation
            title: Field or cross-field validation failed
            status: 422
            detail: Field or cross-field validation failed.
    PreconditionRequired:
      description: If-Match required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/preconditionrequired
            title: If-Match required
            status: 428
            detail: If-Match required.
    RateLimited:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/ratelimited
            title: Rate limited
            status: 429
            detail: Rate limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    ServerError:
      description: Internal failure; safe detail only
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/servererror
            title: Internal failure; safe detail only
            status: 500
            detail: Internal failure; safe detail only.
  schemas:
    Engine:
      type: string
      enum: [ookla, librespeed]
      default: ookla
    EngineScheduleInput:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        interval:
          type: integer
          minimum: 5
          maximum: 1440
          default: 60
        offset:
          type: integer
          minimum: 0
          maximum: 1439
          default: 0
        enabled:
          type: boolean
          default: false
        serverId:
          description: Pinned server ID for this engine, or auto to let the engine choose.
          oneOf:
            - const: auto
              type: string
            - type: integer
              minimum: 1
              maximum: 2147483647
      required: [engine, enabled]
    AgentEngineSchedule:
      allOf:
        - $ref: "#/components/schemas/EngineScheduleInput"
        - type: object
          required: [serverId]
    NodeEngineSchedulesInput:
      type: object
      additionalProperties: false
      properties:
        engines:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/EngineScheduleInput"
      required: [engines]
    ID:
      type: string
      description: Opaque resource identifier; clients must not interpret its structure.
      minLength: 1
      maxLength: 128
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      description: RFC 3339 UTC timestamp. Convert demo epoch milliseconds at the UI boundary.
      format: date-time
      pattern: Z$
      examples:
        - 2026-11-03T00:00:00Z
    IP:
      description: IPv4 or IPv6 literal only; never a hostname.
      anyOf:
        - type: string
          format: ipv4
        - type: string
          format: ipv6
    Mbps:
      type: number
      description: Decimal megabits per second (1 Mbps = 1,000,000 bit/s).
      minimum: 0
    Milliseconds:
      type: number
      description: Milliseconds.
      minimum: 0
    Percent:
      type: number
      description: Percent on the 0–100 scale.
      minimum: 0
      maximum: 100
    Measurement:
      type:
        - number
        - "null"
      description: Unavailable measurements are null, never zero-filled.
      minimum: 0
    Metric:
      type: string
      enum:
        - down
        - up
        - ping
        - jitter
        - loss
    Range:
      type: string
      enum:
        - 6h
        - 24h
        - 7d
        - 30d
      default: 7d
    Channel:
      type: string
      enum:
        - email
        - telegram
        - slack
        - webhook
    Severity:
      type: string
      enum:
        - info
        - warn
        - crit
    ResultStatus:
      type: string
      enum:
        - ok
        - degraded
        - failed
    FailureClass:
      type: string
      description: Fixed vocabulary for why a test failed. Successful results use other.
      enum:
        - rate_limited
        - no_network
        - server_unreachable
        - engine_missing
        - timeout
        - other
      default: other
    Secret:
      type: string
      description: Write-only secret; never returned, logged or included in errors.
      minLength: 1
      maxLength: 8192
      writeOnly: true
    Timezone:
      type: string
      description: IANA time-zone name; browser is a UI preference only and must be resolved before
        analytics requests.
      examples:
        - Asia/Ho_Chi_Minh
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: Stable category URI.
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe actionable detail.
        instance:
          type: string
          format: uri-reference
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        trace_id:
          type: string
      required:
        - type
        - title
        - status
        - detail
    Pagination:
      type: object
      additionalProperties: false
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
      required:
        - current_page
        - per_page
        - total
        - last_page
      description: Page/size request parameters; last_page is at least 1 even when total is 0. Beyond-last
        pages return an empty array.
    Meta:
      type: object
      additionalProperties: false
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: []
    Success:
      type: object
      additionalProperties: false
      properties:
        success:
          const: true
        code:
          type: integer
          minimum: 200
          maximum: 299
        message:
          type: string
        data: {}
        meta:
          $ref: "#/components/schemas/Meta"
        errors:
          type: "null"
        trace_id:
          type: string
      required:
        - success
        - code
        - message
        - data
        - meta
        - errors
      description: Shared JSON envelope. code equals the HTTP status. Endpoint schemas specialize data and
        code; 204/304 and documented streams have no envelope.
    Geo:
      type: object
      additionalProperties: false
      properties:
        ip:
          $ref: "#/components/schemas/IP"
        version:
          type: integer
          enum:
            - 4
            - 6
        asn:
          type: integer
          minimum: 0
          maximum: 4294967295
        asnOrg:
          type: string
        isp:
          type: string
        country:
          type: string
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        region:
          type: string
        city:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          $ref: "#/components/schemas/Timezone"
        radiusKm:
          type: number
          description: Approximate accuracy radius in km.
          minimum: 0
        connection:
          type: string
        source:
          type: string
        qualityScore:
          type: integer
          minimum: 0
          maximum: 100
        fieldSources:
          type: object
          additionalProperties: false
          properties:
            city:
              type: string
            region:
              type: string
            country:
              type: string
            time_zone:
              type: string
            organisation:
              type: string
            coordinates:
              type: string
            asn:
              type: string
            accuracy_radius:
              type: string
      required:
        - ip
        - version
        - source
      description: Unknown individual attributes are omitted; an unavailable lookup is null, not
        fabricated coordinates.
    Binding:
      type: object
      additionalProperties: false
      properties:
        iface:
          type: string
          description: Interface name, empty for automatic.
          maxLength: 64
          default: ""
        sourceIp:
          anyOf:
            - $ref: "#/components/schemas/IP"
            - type: "null"
      required:
        - iface
        - sourceIp
      description: Local network binding only; contains no topology relationships.
    NodeInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        label:
          type: string
          maxLength: 200
          default: ""
        provider:
          type: string
          description: User-supplied display label.
          maxLength: 200
          default: ""
        plan:
          type: string
          description: User-supplied display label.
          maxLength: 200
          default: ""
        ispPlanId:
          $ref: "#/components/schemas/ID"
        expectedDown:
          type: number
          exclusiveMinimum: 0
        expectedUp:
          type: number
          exclusiveMinimum: 0
        threads:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        server:
          oneOf:
            - const: auto
            - type: integer
              minimum: 1
          default: auto
        note:
          type: string
          maxLength: 4000
          default: ""
        enabled:
          type: boolean
          default: true
        binding:
          $ref: "#/components/schemas/Binding"
        autoUpdate:
          type: boolean
          default: false
      required:
        - name
      allOf:
        - if:
            required: [ispPlanId]
          then: {}
          else:
            required: [expectedDown, expectedUp]
    NodePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        label:
          type: string
          maxLength: 200
          default: ""
        provider:
          type: string
          description: User-supplied display label.
          maxLength: 200
          default: ""
        plan:
          type: string
          description: User-supplied display label.
          maxLength: 200
          default: ""
        ispPlanId:
          anyOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        expectedDown:
          type: number
          exclusiveMinimum: 0
        expectedUp:
          type: number
          exclusiveMinimum: 0
        threads:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        server:
          oneOf:
            - const: auto
            - type: integer
              minimum: 1
          default: auto
        note:
          type: string
          maxLength: 4000
          default: ""
        enabled:
          type: boolean
          default: true
        binding:
          $ref: "#/components/schemas/Binding"
        autoUpdate:
          type: boolean
          default: false
      required: []
      description: JSON Merge Patch; supplied properties replace their value, null is invalid. At least
        one property required. Name must be unique.
      minProperties: 1
    ScheduleInput:
      type: object
      additionalProperties: false
      properties:
        interval:
          type: integer
          minimum: 5
          maximum: 1440
          default: 60
        offset:
          type: integer
          minimum: 0
          maximum: 1439
          default: 0
        enabled:
          type: boolean
          default: true
      required:
        - interval
        - offset
        - enabled
      description: Minutes. offset must be less than interval; PUT clamps offset to interval-1 after an
        interval change. Base slots are Unix epoch + offset + k*interval.
    QuietHours:
      type: object
      additionalProperties: false
      properties:
        quietStart:
          type: string
          description: HH:mm or empty; both quiet fields must be empty or set.
          pattern: ^(|([01][0-9]|2[0-3]):[0-5][0-9])$
          default: ""
        quietEnd:
          type: string
          description: HH:mm or empty; equal nonempty endpoints are invalid. Crossing midnight is allowed.
          pattern: ^(|([01][0-9]|2[0-3]):[0-5][0-9])$
          default: ""
        timezone:
          $ref: "#/components/schemas/Timezone"
          default: UTC
      required:
        - quietStart
        - quietEnd
        - timezone
    ScheduleRules:
      type: object
      additionalProperties: false
      properties:
        stagger:
          type: boolean
          default: true
        maxConcurrent:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        quiet:
          $ref: "#/components/schemas/QuietHours"
      required:
        - stagger
        - maxConcurrent
        - quiet
      description: Center-only coordination rules. Effective offsets and quiet hours are sent separately
        to each node; no peer list is sent.
    Schedule:
      type: object
      additionalProperties: false
      properties:
        engines:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/Schedule"
        engine:
          $ref: "#/components/schemas/Engine"
        nodeId:
          $ref: "#/components/schemas/ID"
        config:
          $ref: "#/components/schemas/ScheduleInput"
        nextRun:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/Timestamp"
          maxItems: 10
        bytesPerDay:
          type: number
          minimum: 0
        bytesPerMonth:
          type: number
          description: 30-day estimate from up to 200 recent nonfailed results; zero with no history or while
            paused.
          minimum: 0
      required:
        - nodeId
        - config
        - nextRun
        - upcoming
        - bytesPerDay
        - bytesPerMonth
    Clash:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ID"
          minItems: 2
          maxItems: 2
        detail:
          type: string
      required:
        - nodes
        - detail
    Schedules:
      type: object
      additionalProperties: false
      properties:
        rules:
          $ref: "#/components/schemas/ScheduleRules"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        clashes:
          type: array
          items:
            $ref: "#/components/schemas/Clash"
      required:
        - rules
        - nodes
        - clashes
    AgentConfig:
      type: object
      additionalProperties: false
      properties:
        schedules:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/AgentEngineSchedule"
        revision:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        expectedDown:
          $ref: "#/components/schemas/Mbps"
        expectedUp:
          $ref: "#/components/schemas/Mbps"
        schedule:
          $ref: "#/components/schemas/ScheduleInput"
        quiet:
          $ref: "#/components/schemas/QuietHours"
        engine:
          type: string
          enum:
            - ookla
            - librespeed
            - cloudflare
          default: ookla
        serverSelectionSnapshots:
          type: boolean
          description: True when result reports may include the pin captured at measurement time.
        threads:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        server:
          oneOf:
            - const: auto
            - type: integer
              minimum: 1
          default: auto
        binding:
          $ref: "#/components/schemas/Binding"
        autoUpdate:
          type: boolean
          default: false
        release:
          anyOf:
            - $ref: "#/components/schemas/AgentRelease"
            - type: "null"
      required:
        - revision
        - name
        - expectedDown
        - expectedUp
        - schedule
        - quiet
        - engine
        - threads
        - server
        - binding
        - autoUpdate
        - release
      description: Only this authenticated node’s effective configuration. Apply atomically without
        restart; retain last known configuration offline. release advertises latest
        version/url/sha256; update only when owner enables autoUpdate. Verify checksum; atomically
        replace and roll back if first heartbeat fails within 2 minutes.
    Server:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        host:
          type: string
          maxLength: 255
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: Full engine endpoint identity. LibreSpeed includes this so servers sharing a host remain distinct.
        city:
          type: string
        sponsor:
          type: string
      anyOf:
        - required: [name]
          properties:
            name:
              type: string
              pattern: "\\S"
        - required: [host]
          properties:
            host:
              type: string
              pattern: "\\S"
      description: Engine server identity. Numeric ID is optional for automatic LibreSpeed selection.
    ServerOption:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        name:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          maxLength: 120
        isp:
          type: string
          maxLength: 200
        host:
          type: string
          maxLength: 255
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: Present for LibreSpeed; preserves the configured endpoint path for server matching.
        distanceKm:
          type: number
          minimum: 0
          description: Present only when supplied by the engine, currently Ookla.
      required: [id, name, city, isp, host]
    ServerCatalog:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        servers:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ServerOption"
        serverId:
          oneOf:
            - const: auto
              type: string
            - type: integer
              minimum: 1
              maximum: 2147483647
        refreshedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required: [engine, servers, serverId, refreshedAt]
    ServerSelectionInput:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        serverId:
          description: Use auto to clear the pin; numeric IDs must be in this engine's catalog.
          oneOf:
            - const: auto
              type: string
            - type: integer
              minimum: 1
              maximum: 2147483647
      required: [engine, serverId]
    ResultInput:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        id:
          $ref: "#/components/schemas/UUID"
        ts:
          $ref: "#/components/schemas/Timestamp"
        status:
          $ref: "#/components/schemas/ResultStatus"
        down:
          $ref: "#/components/schemas/NullableMbps"
        up:
          $ref: "#/components/schemas/NullableMbps"
        ping:
          $ref: "#/components/schemas/NullableMilliseconds"
        jitter:
          $ref: "#/components/schemas/NullableMilliseconds"
        dLat:
          $ref: "#/components/schemas/NullableMilliseconds"
        uLat:
          $ref: "#/components/schemas/NullableMilliseconds"
        loss:
          type:
            - number
            - "null"
          description: Packet loss percent; unavailable on failure.
          minimum: 0
          maximum: 100
        serverId:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        serverSelectionKnown:
          type: boolean
          description: Present on agents that support pin snapshots; false or absent means the effective selection is unknown.
        pinnedServerId:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 2147483647
            - type: "null"
          description: Pin active when the measurement ran; omitted by older agents and null when no pin was active.
        ip:
          anyOf:
            - $ref: "#/components/schemas/IP"
            - type: "null"
        threads:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        bytesDown:
          type: integer
          minimum: 0
        bytesUp:
          type: integer
          minimum: 0
        duration:
          type: number
          description: Seconds.
          minimum: 0
        error:
          type:
            - string
            - "null"
          maxLength: 2000
        failureClass:
          $ref: "#/components/schemas/FailureClass"
        manual:
          type: boolean
          default: false
        raw:
          type: object
          additionalProperties: true
          description: Original engine JSON, at most 64 KiB encoded. Redact credentials before ingestion;
            never a transport log.
        loadedDown:
          anyOf:
            - $ref: "#/components/schemas/LoadedLatency"
            - type: "null"
        loadedUp:
          anyOf:
            - $ref: "#/components/schemas/LoadedLatency"
            - type: "null"
        server:
          anyOf:
            - $ref: "#/components/schemas/Server"
            - type: "null"
        engineISP:
          type:
            - string
            - "null"
        engineResultId:
          type:
            - string
            - "null"
        engineResultUrl:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        engineIp:
          anyOf:
            - $ref: "#/components/schemas/IP"
            - type: "null"
        warnings:
          type: array
          items:
            type: string
            maxLength: 2000
          maxItems: 10
      required:
        - id
        - ts
        - status
        - down
        - up
        - ping
        - jitter
        - dLat
        - uLat
        - loss
        - serverId
        - ip
        - threads
        - bytesDown
        - bytesUp
        - duration
        - error
        - manual
      description: Globally unique UUID allocated before spooling. Failed results require a nonempty error and allow null
        metrics/serverId/ip; ok/degraded require down, up, ping, ip and server identity, and error=null. down/up
        are Mbps; ping/jitter/dLat/uLat are ms. Missing measurements remain null. Engine-specific
        loss/jitter/loaded metrics may be null even on success when unavailable; never invent zero.
        Optional typed engine details preserve low/iqm/high, ISP, external IP, result ID/URL; raw
        retains remaining fields. warnings records an engine/public-IP mismatch without changing
        selected binding. failureClass is a fixed vocabulary; omitted failed results are classified
        from the error text, and successful results use other.
      allOf:
        - if:
            properties:
              status:
                const: failed
          then:
            properties:
              error:
                type: string
                minLength: 1
                maxLength: 2000
          else:
            required: [server]
            properties:
              down:
                $ref: "#/components/schemas/Mbps"
              up:
                $ref: "#/components/schemas/Mbps"
              ping:
                $ref: "#/components/schemas/Milliseconds"
              ip:
                $ref: "#/components/schemas/IP"
              server:
                $ref: "#/components/schemas/Server"
              error:
                type: "null"
              failureClass:
                const: other
    UsageBytes:
      type: object
      additionalProperties: false
      properties:
        bytesDown:
          type: integer
          format: int64
          minimum: 0
        bytesUp:
          type: integer
          format: int64
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          minimum: 0
      required: [bytesDown, bytesUp, totalBytes]
    UsageBucket:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          $ref: "#/components/schemas/UUID"
        engine:
          $ref: "#/components/schemas/Engine"
        ispId:
          $ref: "#/components/schemas/UUID"
        ispName:
          type: string
        start:
          $ref: "#/components/schemas/Timestamp"
        bytesDown:
          type: integer
          format: int64
          minimum: 0
        bytesUp:
          type: integer
          format: int64
          minimum: 0
