                $ref: "#/components/schemas/lookupIPResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: ip
          in: query
          required: true
          description: IPv4/IPv6 literal; no DNS lookup.
          schema:
            $ref: "#/components/schemas/IP"
  /api/ip/map:
    get:
      operationId: getMap
      tags:
        - IP
      summary: Read current location per node
      description: Current latest observed IP per node. No-IP nodes omitted; unknown location is geo=null.
        Join Node for label/color.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/Node"
  /api/jobs/{id}:
    get:
      operationId: getJob
      tags:
        - Jobs
      summary: Read asynchronous maintenance status
      description: Read asynchronous maintenance status.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
  /api/installer/probes:
    post:
      operationId: probeSSH
      tags:
        - Installer
      summary: Probe SSH and return host fingerprint
      description: Performs only the SSH host-key handshake, without username/password/key. Returns
        observed fingerprint for owner confirmation. Probe records endpoint/fingerprint with expiry,
        never credentials; it does not authenticate or install.
      security:
        - SessionCookie: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/probeSSHResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHProbeInput"
  /api/nodes/{id}/installations:
    post:
      operationId: installAgent
      tags:
        - Installer
      summary: Install or repair node agent
      description: Requires explicit confirmed fingerprint from probe. Linux amd64/arm64, checksum
        verified, dedicated service user, enrollment, first heartbeat. Idempotent repair; changed
        key aborts and failure cleans up.
      security:
        - SessionCookie: []
      responses:
        "202":
          description: Accepted; poll Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/installAgentResponse"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallInput"
  /api/installations/{id}:
    get:
      operationId: getInstallation
      tags:
        - Installer
      summary: Read installation state
      description: Read installation state.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInstallationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
  /api/installations/{id}/events:
    get:
      operationId: streamInstallEvents
      tags:
        - Installer
      summary: Stream safe installer progress
      description: "SSE data is one InstallEvent JSON object per event, event: progress. id matches
        InstallEvent.id. Replay retained events on reconnect; 409 if cursor expired. Terminal event
        closes stream. Errors before opening use Problem; after opening use failed InstallEvent.
        Session authorization checked before stream and on expiry."
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Server-sent events; no JSON envelope.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/InstallEvent"
              example:
                id: step-1
                ts: 2026-11-03T00:00:00Z
                step: verify
                message: Agent checksum verified
                pct: 30
                status: running
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume after last seen event.
          schema:
            type: string
  /api/nodes/{id}/uninstallations:
    post:
      operationId: uninstallAgent
      tags:
        - Installer
      summary: Uninstall agent before node deletion
      description: Confirmed pinned SSH connection; remove only agent-owned files/service. Poll
        /api/installations/{id}; then explicitly delete node. If SSH unavailable show local agent
        uninstall command; never claim remote cleanup succeeded.
      security:
        - SessionCookie: []
      responses:
        "202":
          description: Accepted; poll Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uninstallAgentResponse"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallInput"
  /install.sh:
    get:
      operationId: getInstallScript
      tags:
        - Installer
      summary: Download public checksum-verifying installer
      description: Public script contains no embedded credentials. Caller supplies center URL and token at
        execution time; script never logs credentials. Resolves OS/architecture and verifies
        released SHA256SUMS.
      security: []
      responses:
        "200":
          description: Shell script; no JSON envelope.
          content:
            text/x-shellscript:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: speedtest_session
      description: Opaque server-side session; UI writes also require X-CSRF-Token and same-origin Origin validation.
    NodeBearer:
      type: http
      scheme: bearer
      description: Node-scoped long-lived credential; never accepts UI sessions or enrollment keys.
    EnrollmentKey:
      type: http
      scheme: bearer
      description: Shared Settings key, accepted only to create enrollment tokens.
  parameters:
    Engine:
      name: engine
      in: query
      description: Omission uses each node's primary engine; engines are never blended.
      schema:
        $ref: "#/components/schemas/Engine"
    Page:
      name: page
      in: query
      required: false
      description: 1-based page.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Maximum items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Nodes:
      name: nodes
      in: query
      required: false
      description: Comma-separated node IDs; omitted means all authorized nodes, empty means none.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ID"
        maxItems: 100
        uniqueItems: true
      style: form
      explode: false
    Node:
      name: node
      in: query
      required: false
      description: Optional single-node filter; omitted means all.
      schema:
        $ref: "#/components/schemas/ID"
    From:
      name: from
      in: query
      required: false
      description: Inclusive start; paired with to. Overrides the default range; explicitly supplying both
        range and from/to is invalid.
      schema:
        $ref: "#/components/schemas/Timestamp"
    To:
      name: to
      in: query
      required: false
      description: Exclusive end; must follow from; maximum analytics span 366 days.
      schema:
        $ref: "#/components/schemas/Timestamp"
    Range:
      name: range
      in: query
      required: false
      description: Trailing range ending at snapshot, default 7d only if no from/to. Explicit range with
        from/to is invalid.
      schema:
        $ref: "#/components/schemas/Range"
    Metric:
      name: metric
      in: query
      required: false
      description: Selected metric; default down.
      schema:
        $ref: "#/components/schemas/Metric"
        default: down
    Timezone:
      name: timezone
      in: query
      required: false
      description: IANA zone for calendar grouping, never browser.
      schema:
        type: string
        description: IANA time-zone name; browser is a UI preference only and must be resolved before
          analytics requests.
        examples:
          - Asia/Ho_Chi_Minh
        default: UTC
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Required strong ETag from GET; 412 if stale, 428 if missing.
      schema:
        type: string
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token from auth/me, including the anonymous bootstrap session.
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      description: Must be the same origin as the command center request. HTTPS deployments behind a TLS-terminating proxy must configure its CIDR as trusted.
      schema:
        type: string
        format: uri
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for retryable creates. Same principal/key/body replays original response for
        24h; different body returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Status:
      name: status
      in: query
      required: false
      description: Result status filter.
      schema:
        type: string
        enum:
          - all
          - ok
          - degraded
          - failed
        default: all
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive substring in IP, server name/city, location city/ISP, node name/label
        or error.
      schema:
        type: string
        maxLength: 200
    MinDown:
      name: minDown
      in: query
      required: false
      description: Inclusive minimum download; null metrics do not match.
      schema:
        $ref: "#/components/schemas/Mbps"
    MaxDown:
      name: maxDown
      in: query
      required: false
      description: Inclusive maximum download; must be >= minDown.
      schema:
        $ref: "#/components/schemas/Mbps"
    Sort:
      name: sort
      in: query
      required: false
      description: Allowlisted sort key; node=name, server=city; nulls last; id breaks ties.
      schema:
        type: string
        enum:
          - ts
          - node
          - down
          - up
          - ping
          - jitter
          - loss
          - server
          - ip
          - status
        default: ts
    Dir:
      name: dir
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
  headers:
    Allow:
      description: Methods supported by the requested resource.
      required: true
      schema:
        type: string
    ETag:
      description: Strong version of this representation.
      schema:
        type: string
    Location:
      description: URI of the created or accepted resource.
      schema:
        type: string
        format: uri-reference
    SetCookie:
      description: "speedtest_session cookie: HttpOnly; SameSite=Lax; Path=/; Secure over HTTPS. Logout
        expires it."
      schema:
        type: string
    RetryAfter:
      description: Seconds before retry.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/badrequest
            title: Malformed request
            status: 400
            detail: Malformed request.
    Unauthorized:
      description: Missing, expired, revoked or invalid credential
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/unauthorized
            title: Missing, expired, revoked or invalid credential
            status: 401
            detail: Missing, expired, revoked or invalid credential.
      headers:
        WWW-Authenticate:
          description: Bearer for agent/bootstrap; Session for UI.
          schema:
            type: string
    Forbidden:
      description: Not authorized or CSRF/Origin validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/forbidden
            title: Not authorized or CSRF/Origin validation failed
            status: 403
            detail: Not authorized or CSRF/Origin validation failed.
    NotFound:
      description: Resource not found or not owned
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/notfound
            title: Resource not found or not owned
            status: 404
            detail: Resource not found or not owned.
    MethodNotAllowed:
      description: The request method is not supported by this resource
      headers:
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/methodnotallowed
            title: Method not allowed
            status: 405
            detail: The request method is not allowed for this resource.
    Conflict:
      description: State, unique name or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/conflict
            title: State, unique name or idempotency conflict
            status: 409
            detail: State, unique name or idempotency conflict.
    Stale:
      description: ETag does not match
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/stale
            title: ETag does not match
            status: 412
            detail: ETag does not match.
    TooLarge:
      description: Request body exceeds limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/toolarge
            title: Request body exceeds limit
            status: 413
            detail: Request body exceeds limit.
    Validation:
      description: Field or cross-field validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/validation
            title: Field or cross-field validation failed
            status: 422
            detail: Field or cross-field validation failed.
    PreconditionRequired:
      description: If-Match required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/preconditionrequired
            title: If-Match required
            status: 428
            detail: If-Match required.
    RateLimited:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/ratelimited
            title: Rate limited
            status: 429
            detail: Rate limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    ServerError:
      description: Internal failure; safe detail only
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: /problems/servererror
            title: Internal failure; safe detail only
            status: 500
            detail: Internal failure; safe detail only.
  schemas:
    Engine:
      type: string
      enum: [ookla, librespeed]
      default: ookla
    EngineScheduleInput:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        interval:
          type: integer
          minimum: 5
          maximum: 1440
          default: 60
        offset:
          type: integer
          minimum: 0
          maximum: 1439
          default: 0
        enabled:
          type: boolean
          default: false
      required: [engine, enabled]
    NodeEngineSchedulesInput:
      type: object
      additionalProperties: false
      properties:
        engines:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/EngineScheduleInput"
      required: [engines]
    ID:
      type: string
      description: Opaque resource identifier; clients must not interpret its structure.
      minLength: 1
      maxLength: 128
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      description: RFC 3339 UTC timestamp. Convert demo epoch milliseconds at the UI boundary.
      format: date-time
      pattern: Z$
      examples:
        - 2026-11-03T00:00:00Z
    IP:
      description: IPv4 or IPv6 literal only; never a hostname.
      anyOf:
        - type: string
          format: ipv4
        - type: string
          format: ipv6
    Mbps:
      type: number
      description: Decimal megabits per second (1 Mbps = 1,000,000 bit/s).
      minimum: 0
    Milliseconds:
      type: number
      description: Milliseconds.
      minimum: 0
    Percent:
      type: number
      description: Percent on the 0–100 scale.
      minimum: 0
      maximum: 100
    Measurement:
      type:
        - number
        - "null"
      description: Unavailable measurements are null, never zero-filled.
      minimum: 0
    Metric:
      type: string
      enum:
        - down
        - up
        - ping
        - jitter
        - loss
    Range:
      type: string
      enum:
        - 6h
        - 24h
        - 7d
        - 30d
      default: 7d
    Channel:
      type: string
      enum:
        - email
        - telegram
        - slack
        - webhook
    Severity:
      type: string
      enum:
        - info
        - warn
        - crit
    ResultStatus:
      type: string
      enum:
        - ok
        - degraded
        - failed
    FailureClass:
      type: string
      description: Fixed vocabulary for why a test failed. Successful results use other.
      enum:
        - rate_limited
        - no_network
        - server_unreachable
        - engine_missing
        - timeout
        - other
      default: other
    Secret:
      type: string
      description: Write-only secret; never returned, logged or included in errors.
      minLength: 1
      maxLength: 8192
      writeOnly: true
    Timezone:
      type: string
      description: IANA time-zone name; browser is a UI preference only and must be resolved before
        analytics requests.
      examples:
        - Asia/Ho_Chi_Minh
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: Stable category URI.
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe actionable detail.
        instance:
          type: string
          format: uri-reference
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        trace_id:
          type: string
      required:
        - type
        - title
        - status
        - detail
    Pagination:
      type: object
      additionalProperties: false
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
      required:
        - current_page
        - per_page
        - total
        - last_page
      description: Page/size request parameters; last_page is at least 1 even when total is 0. Beyond-last
        pages return an empty array.
    Meta:
      type: object
      additionalProperties: false
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: []
    Success:
      type: object
      additionalProperties: false
      properties:
        success:
          const: true
        code:
          type: integer
          minimum: 200
          maximum: 299
        message:
          type: string
        data: {}
        meta:
          $ref: "#/components/schemas/Meta"
        errors:
          type: "null"
        trace_id:
          type: string
      required:
        - success
        - code
        - message
        - data
        - meta
        - errors
      description: Shared JSON envelope. code equals the HTTP status. Endpoint schemas specialize data and
        code; 204/304 and documented streams have no envelope.
    Geo:
      type: object
      additionalProperties: false
      properties:
        ip:
          $ref: "#/components/schemas/IP"
        version:
          type: integer
          enum:
            - 4
            - 6
        asn:
          type: integer
          minimum: 0
        asnOrg:
          type: string
        isp:
          type: string
        country:
          type: string
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        region:
          type: string
        city:
