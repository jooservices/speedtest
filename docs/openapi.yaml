          anyOf:
            - $ref: "#/components/schemas/Percent"
            - type: "null"
        down:
          $ref: "#/components/schemas/MetricSummary"
        up:
          $ref: "#/components/schemas/MetricSummary"
        ping:
          $ref: "#/components/schemas/MetricSummary"
        jitter:
          $ref: "#/components/schemas/MetricSummary"
        loss:
          $ref: "#/components/schemas/MetricSummary"
        ipCount:
          type: integer
          minimum: 0
        downPct:
          $ref: "#/components/schemas/Measurement"
        upPct:
          $ref: "#/components/schemas/Measurement"
        stability:
          anyOf:
            - $ref: "#/components/schemas/Percent"
            - type: "null"
      required:
        - count
        - ok
        - failed
        - rateLimited
        - successRate
        - down
        - up
        - ping
        - jitter
        - loss
        - ipCount
