          $ref: "#/components/schemas/Fleet"
        previous:
          $ref: "#/components/schemas/Fleet"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeCard"
        latestResults:
          type: array
          items:
            $ref: "#/components/schemas/Result"
          maxItems: 9
        openAlerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvent"
          maxItems: 6
        openAlertCount:
          type: integer
          minimum: 0
      required:
        - current
        - previous
        - nodes
        - latestResults
        - openAlerts
        - openAlertCount
    AlertRuleInput:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        name:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          enum:
            - down_pct
            - up_pct
            - ping
            - jitter
            - loss
            - failed
            - ip_changed
            - offline
        op:
          type: string
          enum:
            - <
            - ">"
            - <=
            - ">="
            - =
        value:
          type: number
          minimum: 0
        forTests:
          type: integer
          minimum: 1
          maximum: 1000
        nodes:
          oneOf:
            - const: all
            - type: array
              items:
                $ref: "#/components/schemas/ID"
              minItems: 1
              maxItems: 100
              uniqueItems: true
        severity:
          $ref: "#/components/schemas/Severity"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
          maxItems: 4
          uniqueItems: true
          minItems: 1
        enabled:
          type: boolean
          default: true
      required:
        - name
        - metric
        - op
        - value
        - forTests
        - nodes
        - severity
        - channels
        - enabled
      description: down_pct/up_pct use percent of expected; ping/jitter ms; loss percent <=100. failed
        uses consecutive failures, ip_changed a one-shot change, offline three missed heartbeats.
        For ip_changed/offline use op="=", value=1, forTests=1.
    AlertRule:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          enum:
            - down_pct
            - up_pct
            - ping
            - jitter
            - loss
            - failed
            - ip_changed
            - offline
        op:
          type: string
          enum:
            - <
            - ">"
            - <=
            - ">="
            - =
        value:
