              maxItems: 100
              uniqueItems: true
        severity:
          $ref: "#/components/schemas/Severity"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
          maxItems: 4
          uniqueItems: true
          minItems: 1
        enabled:
          type: boolean
          default: true
      required:
        - id
        - name
        - metric
        - op
        - value
        - forTests
        - nodes
        - severity
        - channels
        - enabled
    AlertEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ID"
        ruleId:
          anyOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        nodeId:
          $ref: "#/components/schemas/ID"
        severity:
          $ref: "#/components/schemas/Severity"
        ts:
          $ref: "#/components/schemas/Timestamp"
        resolvedAt:
          anyOf:
