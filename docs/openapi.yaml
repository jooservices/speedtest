      required: [monthlyBytes, action]
    UsageAdvice:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          $ref: "#/components/schemas/UUID"
        engine:
          $ref: "#/components/schemas/Engine"
        intervalMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        averageBytesPerTest:
          type:
            - number
            - "null"
          minimum: 0
        estimatedBytesPerDay:
          type:
            - number
            - "null"
          minimum: 0
        estimatedBytesPerMonth:
