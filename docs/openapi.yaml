          type: string
          enum: [feasible, infeasible, unavailable]
      required: [nodeId, engine, intervalMinutes, averageBytesPerTest, estimatedBytesPerDay, estimatedBytesPerMonth, measurementAvailable, sharedMeasurementsAvailable, recommendedIntervalMinutes, recommendationStatus]
    Result:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        id:
          $ref: "#/components/schemas/UUID"
        nodeId:
          $ref: "#/components/schemas/ID"
        ts:
          $ref: "#/components/schemas/Timestamp"
        status:
          $ref: "#/components/schemas/ResultStatus"
        down:
          $ref: "#/components/schemas/NullableMbps"
        up:
          $ref: "#/components/schemas/NullableMbps"
        ping:
          $ref: "#/components/schemas/NullableMilliseconds"
        jitter:
          $ref: "#/components/schemas/NullableMilliseconds"
        dLat:
          $ref: "#/components/schemas/NullableMilliseconds"
        uLat:
          $ref: "#/components/schemas/NullableMilliseconds"
        loss:
          type:
            - number
            - "null"
          description: Packet loss percent; unavailable on failure.
          minimum: 0
          maximum: 100
        serverId:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        pinnedServerId:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 2147483647
            - type: "null"
          description: Pin reported for this measurement; null for automatic selection or older records without a snapshot.
        serverSelectionKnown:
          type: boolean
          description: False when an older agent or historical record did not report the selection used at measurement time.
        ip:
          anyOf:
            - $ref: "#/components/schemas/IP"
            - type: "null"
        threads:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        bytesDown:
          type:
            - integer
            - "null"
          minimum: 0
        bytesUp:
          type:
            - integer
            - "null"
          minimum: 0
        bytesTotal:
          type:
            - integer
            - "null"
          minimum: 0
        duration:
          type: number
          description: Seconds.
          minimum: 0
        error:
          type:
            - string
            - "null"
          maxLength: 2000
        failureClass:
          $ref: "#/components/schemas/FailureClass"
        manual:
          type: boolean
          default: false
        raw:
          type: object
          additionalProperties: true
          description: Original engine JSON, at most 64 KiB encoded. Redact credentials before ingestion;
            never a transport log.
        server:
          anyOf:
            - $ref: "#/components/schemas/Server"
            - type: "null"
        geo:
          anyOf:
            - $ref: "#/components/schemas/Geo"
            - type: "null"
        ispId:
          anyOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
          description: ISP associated with the result's public IP at ingestion time.
        loadedDown:
          anyOf:
            - $ref: "#/components/schemas/LoadedLatency"
            - type: "null"
        loadedUp:
          anyOf:
            - $ref: "#/components/schemas/LoadedLatency"
            - type: "null"
        engineISP:
          type:
            - string
            - "null"
        engineResultId:
          type:
            - string
            - "null"
        engineResultUrl:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        engineIp:
          anyOf:
            - $ref: "#/components/schemas/IP"
            - type: "null"
        warnings:
          type: array
          items:
            type: string
            maxLength: 2000
          maxItems: 10
      required:
        - id
        - nodeId
        - ts
        - status
        - down
        - up
        - ping
        - jitter
        - dLat
        - uLat
        - loss
        - serverId
        - pinnedServerId
        - serverSelectionKnown
        - ip
        - threads
        - bytesDown
        - bytesUp
        - bytesTotal
        - duration
        - error
        - failureClass
        - manual
        - raw
        - server
        - geo
        - ispId
      description: Stored fields plus resolved server and location. nodeId is derived from the credential
        on ingestion, never trusted from agent input. raw is {} if no raw engine JSON was supplied.
        Engine-specific loss/jitter/loaded metrics may be null even on success when unavailable;
        never invent zero. Optional typed engine details preserve low/iqm/high, ISP, external IP,
        result ID/URL; raw retains remaining fields. warnings records an engine/public-IP mismatch
        without changing selected binding. failureClass is the fixed failure vocabulary.

      allOf:
        - if:
            properties:
              status:
                const: failed
          then:
            properties:
              error:
                type: string
                minLength: 1
                maxLength: 2000
          else:
            required: [server]
            properties:
              down:
                $ref: "#/components/schemas/Mbps"
              up:
                $ref: "#/components/schemas/Mbps"
              ping:
                $ref: "#/components/schemas/Milliseconds"
              ip:
                $ref: "#/components/schemas/IP"
              server:
                $ref: "#/components/schemas/Server"
              error:
                type: "null"
              failureClass:
                const: other
    Node:
      type: object
      additionalProperties: false
      properties:
        primaryEngine:
          $ref: "#/components/schemas/Engine"
        engines:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            $ref: "#/components/schemas/Engine"
        name:
          type: string
          minLength: 1
          maxLength: 100
        label:
          type: string
          maxLength: 200
          default: ""
        provider:
          type: string
          description: User-supplied display label.
          maxLength: 200
          default: ""
        plan:
          type: string
          description: User-supplied display label.
          maxLength: 200
          default: ""
        ispPlanId:
          anyOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        expectedDown:
          type: number
          exclusiveMinimum: 0
        expectedUp:
          type: number
          exclusiveMinimum: 0
        threads:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        server:
          oneOf:
            - const: auto
            - type: integer
              minimum: 1
          default: auto
        note:
          type: string
          maxLength: 4000
          default: ""
        enabled:
          type: boolean
          default: true
        binding:
          $ref: "#/components/schemas/Binding"
        id:
          $ref: "#/components/schemas/ID"
        colorSlot:
          type: integer
          minimum: 1
          maximum: 8
        interval:
          type: integer
          minimum: 5
          maximum: 1440
          default: 60
        offset:
          type: integer
          minimum: 0
        host:
          type: string
        agent:
          type: string
          description: Agent version identifier; enrollment and heartbeat may append (goos/goarch). Owner views omit that suffix.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastSeen:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: Receive time of latest heartbeat; not inferred from result time.
        status:
          type: string
          enum:
            - online
            - offline
            - paused
            - failed
            - degraded
        latest:
          anyOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
        latestGood:
          anyOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
        currentIp:
          anyOf:
            - $ref: "#/components/schemas/IP"
            - type: "null"
        geo:
          anyOf:
            - $ref: "#/components/schemas/Geo"
            - type: "null"
        isp:
          anyOf:
            - $ref: "#/components/schemas/ISPRef"
            - type: "null"
          description: Current ISP derived from the node's current public IP ASN.
        updateVersion:
          type:
            - string
            - "null"
        autoUpdate:
          type: boolean
          default: false
      required:
        - name
        - label
        - provider
        - plan
        - expectedDown
        - expectedUp
        - threads
        - server
        - note
        - enabled
        - binding
        - id
        - colorSlot
        - interval
        - offset
        - host
        - agent
        - createdAt
        - lastSeen
        - status
        - latest
        - latestGood
        - currentIp
        - geo
        - isp
        - ispPlanId
        - updateVersion
      description: paused if disabled; otherwise offline if never seen or heartbeat age >90 seconds (three
        30-second heartbeat intervals); otherwise failed/degraded from latest result, else online.
        latestGood includes ok and degraded. host/agent may be empty before enrollment.
    Enrollment:
      type: object
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/Node"
        token:
          type: string
          description: One-time token, disclosed only in this creation response. Store hashed; never log.
          readOnly: true
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - node
        - token
        - expiresAt
    EnrollRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          $ref: "#/components/schemas/Secret"
        name:
          type: string
          minLength: 1
          maxLength: 100
        host:
          type: string
          maxLength: 255
        agent:
          type: string
          description: Agent version identifier; enrollment and heartbeat may append (goos/goarch). Owner views omit that suffix.
          maxLength: 64
      required:
        - token
        - name
        - agent
    Enrolled:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          $ref: "#/components/schemas/ID"
        credential:
          type: string
          description: Shown only on successful exchange; store in a 0600 file. Never log.
          readOnly: true
        config:
          $ref: "#/components/schemas/AgentConfig"
      required:
        - nodeId
        - credential
        - config
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/NodeInput"
      required:
        - node
    Heartbeat:
      type: object
      additionalProperties: false
      properties:
        engines:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            $ref: "#/components/schemas/Engine"
        agent:
          type: string
          description: Agent version identifier; enrollment and heartbeat may append (goos/goarch). Owner views omit that suffix.
          maxLength: 64
        uptime:
          type: integer
          minimum: 0
          description: Seconds since process start.
        lastTest:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updateResult:
          anyOf:
            - $ref: "#/components/schemas/AgentUpdateResult"
            - type: "null"
      required:
        - agent
        - uptime
        - lastTest
      description: Send every 30 seconds. Center records its own receive time as lastSeen.
    Receipt:
      type: object
      additionalProperties: false
      properties:
        receivedAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - receivedAt
    ResultBatch:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResultInput"
          minItems: 1
          maxItems: 100
      required:
        - results
      description: Maximum HTTP body 8 MiB. Items are processed independently in input order, including
        invalid items with a recognizable UUID.
    BatchOutcome:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        id:
          anyOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        outcome:
          type: string
          enum:
            - accepted
            - duplicate
            - rejected
        status:
          type: integer
          enum:
            - 201
            - 200
            - 409
            - 422
        problem:
          anyOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
      required:
        - index
        - id
        - outcome
        - status
        - problem
      description: One outcome per input index. accepted=201, duplicate=200, conflicting UUID content=409,
        invalid item=422; problem is null for accepted/duplicate.
    CommandInput:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - run_now
            - pause
            - resume
            - update_config
            - update_agent
        version:
          type: string
          description: Required only for update_agent.
          maxLength: 64
      required:
        - type
    Command:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ID"
        nodeId:
          $ref: "#/components/schemas/ID"
        type:
          type: string
          enum:
            - run_now
            - pause
            - resume
            - update_config
            - update_agent
            - list_servers
        engine:
          description: Set for list_servers; null on other commands.
          anyOf:
            - $ref: "#/components/schemas/Engine"
            - type: "null"
        version:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        ackedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        phase:
          type: string
        pct:
          $ref: "#/components/schemas/Percent"
        resultId:
          anyOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        error:
          type:
            - string
            - "null"
      required:
        - id
        - nodeId
        - type
        - version
        - status
        - createdAt
        - ackedAt
        - phase
        - pct
        - resultId
        - error
      description: Progress is reported in acknowledgements; poll this resource for manual run progress.
    CommandAck:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
        phase:
          type: string
          maxLength: 200
        pct:
          $ref: "#/components/schemas/Percent"
        resultId:
          anyOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        error:
          type:
            - string
            - "null"
          maxLength: 2000
        servers:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ServerOption"
      required:
        - status
      description: Monotonic status/progress. Repeating an identical acknowledgement is idempotent; a
        conflicting terminal acknowledgement returns 409. Failed acknowledgements require safe error
        detail. A successful list_servers acknowledgement includes servers.
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ID"
        email:
          type: string
          format: email
      required:
        - id
        - email
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Secret"
        code:
          type: string
          maxLength: 32
          description: Authenticator code or recovery code. Needed only when two-factor sign-in is on; without it
            the answer is 401 with problem type /problems/two-factor-required.
      required:
        - email
        - password
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        csrfToken:
          type: string
          description: Send in X-CSRF-Token on UI writes; never log.
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - user
        - csrfToken
        - expiresAt
      description: "Anonymous bootstrap: user=null. Authenticated session: user is present.
        Invalid/expired existing cookie returns 401."
    TwoFactorRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          $ref: "#/components/schemas/Secret"
        code:
          type: string
          maxLength: 32
    TwoFactorStatus:
      type: object
      additionalProperties: false
      properties:
        available:
          type: boolean
        enabled:
          type: boolean
        recoveryRemaining:
          type: integer
          minimum: 0
      required:
        - available
        - enabled
        - recoveryRemaining
    TwoFactorSetup:
      type: object
      additionalProperties: false
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry; returned once.
        uri:
          type: string
          description: otpauth provisioning URI.
        qr:
          type: string
          description: PNG data URI of the QR code.
      required:
        - secret
        - uri
        - qr
    TwoFactorRecoveryCodes:
      type: object
      additionalProperties: false
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
      required:
        - recoveryCodes
    PasswordChange:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          $ref: "#/components/schemas/Secret"
        newPassword:
          $ref: "#/components/schemas/Secret"
      required:
        - currentPassword
        - newPassword
    MetricSummary:
      type: object
      additionalProperties: false
      properties:
        n:
          type: integer
          minimum: 0
        mean:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        median:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        min:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        max:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        p5:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        p50:
          type:
            - number
            - "null"
          description: Median percentile, equal to median; null for no samples.
          minimum: 0
        p95:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        p99:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        std:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
      required:
        - n
        - mean
        - median
        - min
        - max
        - p5
        - p50
        - p95
        - p99
        - std
      description: Population std deviation. Percentiles interpolate at (n-1)*p. A single sample has
        std=0; empty aggregates have n=0 and null values.
    NodeSummary:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        ok:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        rateLimited:
          type: integer
          minimum: 0
          description: Failed results classified as rate_limited; excluded from successRate.
