        telegram:
          $ref: "#/components/schemas/ChannelWrite"
        slack:
          $ref: "#/components/schemas/ChannelWrite"
        webhook:
          $ref: "#/components/schemas/ChannelWrite"
      required:
        - email
        - telegram
        - slack
        - webhook
    Settings:
      type: object
      additionalProperties: false
      properties:
        theme:
          type: string
          enum:
            - dark
            - light
          default: dark
        range:
          $ref: "#/components/schemas/Range"
        units:
          type: string
          enum:
            - auto
            - Mbps
            - Gbps
            - MBps
          default: auto
        timezone:
          type: string
          description: browser or valid IANA time zone.
          default: browser
        hour12:
          type: boolean
          default: false
        decimals:
          type: integer
          minimum: 0
          maximum: 2
          default: 1
        retentionDays:
          type: integer
          enum:
            - 0
            - 30
            - 90
            - 365
            - 1095
          default: 365
        geoProvider:
          type: string
          enum:
            - geolite2
            - ipinfo
            - ip-api
          default: geolite2
        geoFallback:
          type: string
          enum:
            - none
            - ip-api
            - ipinfo
          default: ip-api
        geoAutoUpdate:
          type: boolean
          default: true
        engine:
          type: string
          enum:
            - ookla
            - librespeed
            - cloudflare
          default: ookla
        defaultThreads:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        serverMode:
          type: string
          enum:
            - auto
            - pinned
          default: auto
        maxConcurrent:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        stagger:
          type: boolean
          default: true
        quietStart:
          type: string
          description: HH:mm or empty; both quiet fields must be empty or set.
          pattern: ^(|([01][0-9]|2[0-3]):[0-5][0-9])$
          default: ""
        quietEnd:
          type: string
          description: HH:mm or empty; equal nonempty endpoints are invalid. Crossing midnight is allowed.
          pattern: ^(|([01][0-9]|2[0-3]):[0-5][0-9])$
          default: ""
        notifyQuietStart:
          type: string
          description: HH:mm or empty. Alert notifications are held between notifyQuietStart and notifyQuietEnd
