          default: ""
        notifyQuietEnd:
          type: string
          description: HH:mm or empty; crossing midnight is allowed.
          pattern: ^(|([01][0-9]|2[0-3]):[0-5][0-9])$
          default: ""
        notifyQuietTimezone:
          type: string
          description: IANA zone in which the notification quiet hours are read; empty means UTC.
          default: UTC
        notifyQuietCritical:
          type: boolean
          description: When true, critical alerts are delivered even during the notification quiet hours.
          default: true
        centerUrl:
          type: string
          description: Configured public HTTPS origin (empty when not configured); HTTP permitted only
