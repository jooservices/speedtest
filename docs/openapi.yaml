          maxLength: 200
        pct:
          $ref: "#/components/schemas/Percent"
        resultId:
          anyOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        error:
          type:
            - string
            - "null"
          maxLength: 2000
      required:
        - status
      description: Monotonic status/progress. Repeating an identical acknowledgement is idempotent; a
        conflicting terminal acknowledgement returns 409. Failed acknowledgements require safe error
        detail.
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ID"
        email:
          type: string
          format: email
      required:
        - id
        - email
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Secret"
        code:
          type: string
          maxLength: 32
          description: Authenticator code or recovery code. Needed only when two-factor sign-in is on; without it
            the answer is 401 with problem type /problems/two-factor-required.
      required:
        - email
        - password
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        csrfToken:
          type: string
          description: Send in X-CSRF-Token on UI writes; never log.
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - user
        - csrfToken
        - expiresAt
      description: "Anonymous bootstrap: user=null. Authenticated session: user is present.
        Invalid/expired existing cookie returns 401."
    TwoFactorRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          $ref: "#/components/schemas/Secret"
        code:
          type: string
          maxLength: 32
    TwoFactorStatus:
      type: object
      additionalProperties: false
      properties:
        available:
          type: boolean
        enabled:
          type: boolean
        recoveryRemaining:
          type: integer
          minimum: 0
      required:
        - available
        - enabled
        - recoveryRemaining
    TwoFactorSetup:
      type: object
      additionalProperties: false
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry; returned once.
        uri:
          type: string
          description: otpauth provisioning URI.
        qr:
          type: string
          description: PNG data URI of the QR code.
      required:
        - secret
        - uri
        - qr
    TwoFactorRecoveryCodes:
      type: object
      additionalProperties: false
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
      required:
        - recoveryCodes
    PasswordChange:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          $ref: "#/components/schemas/Secret"
        newPassword:
          $ref: "#/components/schemas/Secret"
      required:
        - currentPassword
        - newPassword
    MetricSummary:
      type: object
      additionalProperties: false
      properties:
        n:
          type: integer
          minimum: 0
        mean:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        median:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        min:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        max:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        p5:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        p95:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
        std:
          type:
            - number
            - "null"
          description: Same unit as the selected metric; null for no samples.
          minimum: 0
      required:
        - n
        - mean
        - median
        - min
        - max
        - p5
        - p95
        - std
      description: Population std deviation. Percentiles interpolate at (n-1)*p. A single sample has
        std=0; empty aggregates have n=0 and null values.
    NodeSummary:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        ok:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        rateLimited:
          type: integer
          minimum: 0
          description: Failed results classified as rate_limited; excluded from successRate.
        successRate:
          anyOf:
            - $ref: "#/components/schemas/Percent"
            - type: "null"
        down:
          $ref: "#/components/schemas/MetricSummary"
        up:
          $ref: "#/components/schemas/MetricSummary"
        ping:
          $ref: "#/components/schemas/MetricSummary"
        jitter:
          $ref: "#/components/schemas/MetricSummary"
        loss:
          $ref: "#/components/schemas/MetricSummary"
        ipCount:
          type: integer
          minimum: 0
        downPct:
          $ref: "#/components/schemas/Measurement"
        upPct:
          $ref: "#/components/schemas/Measurement"
        stability:
          anyOf:
            - $ref: "#/components/schemas/Percent"
            - type: "null"
      required:
        - count
        - ok
        - failed
        - rateLimited
        - successRate
        - down
        - up
        - ping
        - jitter
        - loss
        - ipCount
        - downPct
        - upPct
        - stability
      description: ok counts all nonfailed results. successRate = ok/(count-rateLimited)*100.
        Ratios of expected may exceed 100. stability=clamp(100-220*down.std/down.mean,0,100);
        null for zero/no mean.
    SummaryComparison:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          $ref: "#/components/schemas/ID"
        current:
          $ref: "#/components/schemas/NodeSummary"
        previous:
          $ref: "#/components/schemas/NodeSummary"
      required:
        - nodeId
        - current
        - previous
    Point:
      type: object
      additionalProperties: false
      properties:
        ts:
          $ref: "#/components/schemas/Timestamp"
        value:
          type:
            - number
            - "null"
        count:
          type: integer
          minimum: 0
      required:
        - ts
        - value
        - count
    Series:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          anyOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        name:
          type: string
        metric:
          $ref: "#/components/schemas/Metric"
        unit:
          type: string
          enum:
            - Mbps
            - ms
            - "%"
        points:
          type: array
          items:
            $ref: "#/components/schemas/Point"
          maxItems: 300
        summary:
          $ref: "#/components/schemas/MetricSummary"
      required:
        - nodeId
        - name
        - metric
        - unit
        - points
        - summary
      description: nodeId=null denotes an optional display-only combined total, never a node relationship.
        Per-node summaries use raw source samples, not averages of buckets; a combined series summary
        uses its non-null derived bucket totals.
    HourValue:
      type: object
      additionalProperties: false
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        value:
          type:
            - number
            - "null"
        count:
          type: integer
          minimum: 0
      required:
        - hour
        - value
        - count
    HourSeries:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          $ref: "#/components/schemas/ID"
        hours:
          type: array
          items:
            $ref: "#/components/schemas/HourValue"
          minItems: 24
          maxItems: 24
      required:
        - nodeId
        - hours
    HeatCell:
      type: object
      additionalProperties: false
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Monday=0.
        hour:
          type: integer
          minimum: 0
          maximum: 23
        value:
          type:
            - number
            - "null"
        count:
          type: integer
          minimum: 0
      required:
        - weekday
        - hour
        - value
        - count
    Heatmap:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          $ref: "#/components/schemas/ID"
        metric:
          $ref: "#/components/schemas/Metric"
        timezone:
          $ref: "#/components/schemas/Timezone"
        cells:
          type: array
          items:
            $ref: "#/components/schemas/HeatCell"
          minItems: 168
          maxItems: 168
      required:
        - nodeId
        - metric
        - timezone
        - cells
    Bin:
      type: object
      additionalProperties: false
      properties:
        from:
          type: number
        to:
          type: number
        count:
          type: integer
          minimum: 0
        percent:
          $ref: "#/components/schemas/Percent"
      required:
        - from
        - to
        - count
        - percent
      description: Lower-inclusive, upper-exclusive; last bin includes upper bound.
    Distribution:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          $ref: "#/components/schemas/ID"
        metric:
          $ref: "#/components/schemas/Metric"
        bins:
          type: array
          items:
            $ref: "#/components/schemas/Bin"
          maxItems: 100
        count:
          type: integer
          minimum: 0
      required:
        - nodeId
        - metric
        - bins
        - count
      description: Empty data returns bins=[] and count=0; constant data uses a nonzero width centered on
        the constant.
    Fleet:
      type: object
      additionalProperties: false
      properties:
        down:
          $ref: "#/components/schemas/Measurement"
        up:
          $ref: "#/components/schemas/Measurement"
        ping:
          $ref: "#/components/schemas/Measurement"
        success:
          anyOf:
            - $ref: "#/components/schemas/Percent"
            - type: "null"
        rateLimited:
          type: integer
          minimum: 0
          description: Rate-limited failures excluded from success.
        ips:
          type: integer
          minimum: 0
        count:
          type: integer
          minimum: 0
      required:
        - down
        - up
        - ping
        - success
        - rateLimited
        - ips
        - count
      description: "down/up: unweighted mean of nonnull node percentages. ping: median of ok-only pings.
        success: ok/(count-rateLimited)*100. ips: number of address changes for all independent nodes; no
        demo topology exclusion."
    NodeCard:
      type: object
