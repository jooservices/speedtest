  /api/agent/results:
    post:
      operationId: ingestResults
      tags:
        - Agent
      summary: Ingest independently validated result batch
      description: "Always returns 207 for a syntactically valid batch, even if all items are rejected.
        Each outcome includes original index; invalid/missing UUID yields id=null. Schema/range
        validation is PER ITEM, not whole batch. Malformed JSON/invalid top-level container returns
        400/422; oversized body returns 413. UUID is globally unique: identical same-node
        replay=duplicate; changed payload or a UUID belonging to another node=409 for that item,
        without disclosing other-node data. Commit accepted items before
        responding; agent drops accepted/duplicate items, quarantines rejected items, retries
        transport/5xx/429 with exponential backoff and jitter. IP history and address counters
        commit atomically with each result in measurement order (ts, result UUID), including
        failed results with a known IP. Failed results with NULL IP remain stored but are
        excluded from history, counters, geolocation and signals. Late observations repair
        history without new change signals; only a new newest result with a different IP emits
        ip_changed. Replays have no side effects."
      security:
        - NodeBearer: []
      responses:
        "207":
          description: Per-item batch outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ingestResultsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultBatch"
