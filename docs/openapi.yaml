        retains remaining fields. warnings records an engine/public-IP mismatch without changing
        selected binding. failureClass is a fixed vocabulary; omitted failed results are classified
        from the error text, and successful results use other.
      allOf:
        - if:
            properties:
              status:
                const: failed
          then:
