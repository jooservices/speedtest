openapi: 3.1.0
info:
  title: Speedtest agent and UI API
  version: 1.0.0
  description: "Contract-first API for JOOST-9; no endpoints implemented by this document. See api.md
    for authentication, limits, formulas, UI mapping and compatibility. All JSON successes share
    Success; errors use RFC 9457 Problem. Timestamps use Timestamp; units use Mbps, Milliseconds and
    Percent. All responses are private, Cache-Control: no-store except conditional agent config
    (private, no-cache). Paths deliberately retain backlog /api prefix; breaking changes require a
    new major prefix /api/v2 and coordinated migration."
  license:
    name: License not specified
    identifier: LicenseRef-NotSpecified
servers:
  - url: /
    description: Same configured command-center origin; no machine address embedded.
tags:
  - name: Auth
    description: UI session lifecycle
  - name: Agent
    description: Node credential protocol
  - name: Nodes
    description: Independent node administration
  - name: Results
    description: History and exports
  - name: Statistics
    description: Aggregates and charts
  - name: Dashboard
    description: Fleet overview
  - name: Schedules
    description: Timing and coordination
  - name: Alerts
    description: Rules and activity
  - name: Notifications
    description: Delivery and tests
  - name: Settings
    description: Preferences and integrations
  - name: IP
    description: Address history and geolocation
  - name: Jobs
    description: Asynchronous maintenance
  - name: Installer
    description: Secure remote installation
security:
  - SessionCookie: []
paths:
  /api/auth/me:
    get:
      operationId: getSession
      tags:
        - Auth
      summary: Read identity and bootstrap CSRF token
      description: Unauthenticated callers receive 200 with user=null, csrfToken and expiry for an
        anonymous session. Authenticated callers receive their user. Expired/revoked sessions return
        401; a fresh request without a cookie bootstraps again. HTTPS is required outside local/test.
      security:
        - {}
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionResponse"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Create authenticated session
      description: Requires anonymous session cookie, matching CSRF token, and same-origin Origin.
        HTTPS is required outside local/test. Generic invalid-credentials error; per-IP and
        per-account rate limits. Rotates session ID and CSRF token. When two-factor sign-in is on and the
        password is right, a missing code answers 401 /problems/two-factor-required and a wrong or reused code
        answers 401 "Invalid authentication code".
      security:
        - {}
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/loginResponse"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
  /api/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Invalidate current session
      description: Requires same-origin Origin and matching CSRF token. Invalidates the
        server-side session and expires the cookie. Subsequent auth/me using the old cookie returns
        401. HTTPS is required outside local/test.
      security:
        - SessionCookie: []
      responses:
        "204":
          description: No content; the session cookie is expired.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
  /api/auth/password:
    post:
      operationId: changePassword
      tags:
        - Auth
      summary: Change password and invalidate other sessions
      description: Requires same-origin Origin and matching CSRF token. Verify current password,
        apply password policy, hash using argon2id, and rotate current session and CSRF token. Fetch
        auth/me afterwards. HTTPS is required outside local/test.
      security:
        - SessionCookie: []
      responses:
        "204":
          description: No content; the current session cookie is rotated.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
  /api/auth/2fa:
    get:
      operationId: getTwoFactorStatus
      tags:
        - Auth
      summary: Two-factor sign-in status
      description: Whether two-factor sign-in can be used (needs APP_KEY), whether it is on, and how many
        recovery codes are left. Requires a session; never returns secrets.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/twoFactorStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/2fa/setup:
    post:
      operationId: startTwoFactorSetup
      tags:
        - Auth
      summary: Start two-factor setup
      description: Requires the current password. Creates a pending secret (replacing an earlier pending one)
        and returns it once for the authenticator app as a QR code (PNG data URI), an otpauth URI and the
        base32 secret. Two-factor sign-in stays off until the code is confirmed. Fails with 409 while it is on.
      security:
        - SessionCookie: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/twoFactorSetupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorRequest"
  /api/auth/2fa/enable:
    post:
      operationId: enableTwoFactor
      tags:
        - Auth
      summary: Turn two-factor sign-in on
      description: Confirms the pending setup with a current authenticator code and returns ten single-use
        recovery codes, shown only in this response and stored as digests. 409 when there is no pending setup
        or it is already on.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/twoFactorEnableResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorRequest"
  /api/auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      tags:
        - Auth
      summary: Turn two-factor sign-in off
      description: Requires the current password and a current authenticator code or an unused recovery code.
        409 when it is not on.
      security:
        - SessionCookie: []
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorRequest"
  /api/nodes:
    get:
      operationId: listNodes
      tags:
        - Nodes
      summary: List nodes
      description: Sorted by name then id. Contains latest status, results and current location; never
        credentials.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listNodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
    post:
      operationId: createNode
      tags:
        - Nodes
      summary: Create node and one-time enrollment token
      description: Unique name; token is single use and expires in 24h. Store only a hash. Same
        idempotency key replays the issuance securely for its retention period.
      security:
        - SessionCookie: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createNodeResponse"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInput"
  /api/agent/tokens:
    post:
      operationId: createEnrollmentToken
      tags:
        - Agent
      summary: Create node/token using Settings enrollment key
      description: "Install-script bootstrap only. Authorization: Bearer <settings-enrolment-key>. Same
        behavior as POST /api/nodes; cannot list/read/change existing nodes. Rate limited."
      security:
        - EnrollmentKey: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEnrollmentTokenResponse"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - $ref: "#/components/parameters/Idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
  /api/agent/enroll:
    post:
      operationId: enroll
      tags:
        - Agent
      summary: Exchange single-use token for node credential
      description: Token in body authorizes only its reserved node; name must match. Atomically consumes
        token; expired, reused or invalid tokens return generic 401. On lost response issue a new
        token from the owner session; never reuse a consumed token.
      security: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/enrollResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: Invalid, expired or consumed one-time enrollment token.
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
  /api/nodes/{id}:
    get:
      operationId: getNode
      tags:
        - Nodes
      summary: Read node details
      description: Read node details.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getNodeResponse"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
    patch:
      operationId: updateNode
      tags:
        - Nodes
      summary: Update allowed node configuration
      description: Partial replacement of allowed properties. enabled=false pauses, true resumes. Bumps
        agent config ETag; node name must remain unique.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateNodeResponse"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/Stale"
        "422":
          $ref: "#/components/responses/Validation"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/NodePatch"
    delete:
      operationId: deleteNode
      tags:
        - Nodes
      summary: Delete node and its data
      description: Atomically revokes credentials and deletes dependent data. Repeat returns 404 without
        further effects. Uninstall remotely before deletion or use the local agent uninstall
        command.
      security:
        - SessionCookie: []
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/Stale"
        "422":
          $ref: "#/components/responses/Validation"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/IfMatch"
        - name: confirm
          in: query
          required: true
          description: Explicit confirmation required.
          schema:
            const: true
        - $ref: "#/components/parameters/CSRF"
  /api/nodes/{id}/run:
    post:
      operationId: runNode
      tags:
        - Nodes
      summary: Queue manual run
      description: Queues run_now. Poll Location (/api/nodes/{id}/commands/{commandId}). 409 when paused
        or already running. Never overlaps tests on this node.
      security:
        - SessionCookie: []
      responses:
        "202":
          description: Accepted; poll Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runNodeResponse"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Idempotency"
  /api/nodes/{id}/commands:
    post:
      operationId: createCommand
      tags:
        - Nodes
      summary: Queue node control command
      description: run_now, pause, resume, update_config or update_agent. Configuration commands advance
        effective revision; update_agent requires version.
      security:
        - SessionCookie: []
      responses:
        "202":
          description: Accepted; poll Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCommandResponse"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Idempotency"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInput"
  /api/nodes/{id}/commands/{commandId}:
    get:
      operationId: getCommand
      tags:
        - Nodes
      summary: Read command progress
      description: Read command progress.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCommandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: commandId
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
  /api/nodes/{id}/credential:
    post:
      operationId: rotateCredential
      tags:
        - Nodes
      summary: Rotate node credential
      description: Revokes previous credential immediately; returns new credential once. Owner must
        deliver securely to node; existing node data remains. Config contains only this node.
      security:
        - SessionCookie: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rotateCredentialResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: id
          in: path
          required: true
          description: Resource identifier.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Idempotency"
    delete:
      operationId: revokeCredential
      tags:
        - Nodes
      summary: Revoke node credential
      description: All agent endpoints reject the revoked credential immediately. Repeated revocation has
        no extra effect.
      security:
        - SessionCookie: []
      responses:
        "204":
          description: No content; no response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
